<!DOCTYPE html>
<html lang="ja" class="fs-m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12264a">
<title>Meeting English Trainer｜ビジネス会議英語トレーニング</title>
<meta name="description" content="システム開発・開発委託の会議を英語で進めるための実務直結トレーニング">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=008a7e44">
</head>
<body>

<!-- ============ ログイン ============ -->
<div id="login" class="view active" style="padding:0">
  <div style="max-width:420px;margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 20px 40px">
    <div class="center" style="margin-bottom:22px">
      <div style="font-size:2.6rem">🗣️</div>
      <h1 style="font-size:1.3rem;margin:8px 0 2px">Meeting English Trainer</h1>
      <div class="note">システム開発・開発委託の会議を<br>英語で進めるためのトレーニング</div>
    </div>
    <div class="card">
      <div id="loginProfiles"></div>
      <div id="loginForm"></div>
    </div>
    <div class="note center" style="margin-top:14px">
      学習データはこの端末内にのみ保存されます（サーバー送信なし）。<br>
      パスコードは端末内の簡易ロックで、暗号化された認証ではありません。
    </div>
  </div>
</div>

<!-- ============ アプリ本体 ============ -->
<div id="app" hidden>
  <header class="appbar">
    <div>
      <div class="title" id="barTitle">ホーム</div>
      <div class="sub" id="barSub">Meeting English Trainer</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="テーマ切替">🌓</button>
    <button class="avatar" id="avatarBtn" onclick="go('settings')" title="設定">U</button>
  </header>

  <main>
    <!-- ---------- ホーム ---------- -->
    <section id="v-home" class="view"></section>

    <!-- ---------- 会議シナリオ一覧 ---------- -->
    <section id="v-scenarios" class="view"></section>

    <!-- ---------- 学習画面 ---------- -->
    <section id="v-study" class="view"></section>

    <!-- ---------- 復習・テスト ---------- -->
    <section id="v-review" class="view"></section>

    <!-- ---------- 単語・フレーズ集 ---------- -->
    <section id="v-phrases" class="view"></section>

    <!-- ---------- 進捗 ---------- -->
    <section id="v-progress" class="view"></section>

    <!-- ---------- ロールプレイ ---------- -->
    <section id="v-roleplay" class="view"></section>

    <!-- ---------- 設定 ---------- -->
    <section id="v-settings" class="view"></section>
  </main>

  <nav class="tabbar">
    <button id="t-home" onclick="go('home')"><span class="ic">🏠</span>ホーム</button>
    <button id="t-scenarios" onclick="go('scenarios')"><span class="ic">📋</span>シナリオ</button>
    <button id="t-review" onclick="go('review')"><span class="ic">🔁</span>復習</button>
    <button id="t-phrases" onclick="go('phrases')"><span class="ic">📚</span>フレーズ</button>
    <button id="t-progress" onclick="go('progress')"><span class="ic">📊</span>進捗</button>
  </nav>
</div>

<div id="overlay" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script src="data-a.js?v=008a7e44"></script>
<script src="data-b.js?v=008a7e44"></script>
<script src="data.js?v=008a7e44"></script>
<script src="app.js?v=008a7e44"></script>
</body>
</html>
